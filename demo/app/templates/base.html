<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>実験条件デモ</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; margin: 2rem auto; max-width: 900px; color: #222; }
  nav { margin-bottom: 1.5rem; }
  nav a { margin-right: 1rem; text-decoration: none; color: #0b5fff; font-weight: bold; }
  nav a.active { color: #222; text-decoration: underline; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; vertical-align: top; }
  th { background: #f4f4f4; }
  fieldset { border: 1px solid #ddd; margin-bottom: 1rem; padding: 0.75rem 1rem; }
  legend { font-weight: bold; padding: 0 0.3rem; }
  label { display: block; margin: 0.4rem 0 0.15rem; font-size: 0.9rem; color: #444; }
  input, select { padding: 0.3rem; }
  select[multiple] { min-height: 4.5rem; }
  button { padding: 0.4rem 1rem; margin-top: 0.75rem; cursor: pointer; }
  .hint { color: #888; font-size: 0.8rem; }
  .error { color: #b00020; background: #fdecea; border: 1px solid #f5c2c0; padding: 0.6rem; margin-top: 0.75rem; }
  .success { color: #14532d; background: #e8f5e9; border: 1px solid #b6e0bb; padding: 0.6rem; margin-top: 0.75rem; }
  .cond-tag { display: inline-block; background: #eef2ff; border-radius: 0.8rem; padding: 0.1rem 0.6rem; margin: 0.1rem; font-size: 0.85rem; }
</style>
</head>
<body>
<nav>
  <a href="/segments">閲覧</a>
  <a href="/segments/new">登録</a>
  <a href="/segments/search">検索</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
